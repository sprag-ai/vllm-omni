name: Sprag PR GPU tests

# pull_request_target reads this file from the default branch, so a PR cannot edit its own gate. A PR from a branch in
# this repository runs at once; one from a fork waits in the gpu-external environment for a maintainer's approval.
on:
  pull_request_target:
    branches:
      - "release/**"

# No id-token: the publisher's Workload Identity binding trusts any release/** ref, and this run carries the default branch ref.
permissions:
  contents: read

concurrency:
  group: sprag-pr-gpu-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gpu:
    runs-on: sprag-gpu-l4
    environment: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
          && 'gpu-internal' || 'gpu-external' }}
    timeout-minutes: 120
    # No actions/cache: entries written here land in the base branch's cache scope.
    steps:
      # The head SHA, not the branch, so a push after approval cannot swap in unreviewed code.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install
        run: |
          version="$(sed -n 's|^ARG BASE_IMAGE=vllm/vllm-openai:v\(.*\)$|\1|p' docker/Dockerfile.cuda | head -1)"
          [ -n "${version}" ] || { echo "::error::could not read the vLLM version from docker/Dockerfile.cuda"; exit 1; }
          uv venv --python 3.12
          uv pip install "vllm==${version}"
          VLLM_OMNI_TARGET_DEVICE=cuda SETUPTOOLS_SCM_PRETEND_VERSION="${version}" uv pip install -e .
          uv pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-mock==3.15.1 pytest-xdist==3.8.0 \
            pytest-subtests==0.15.0 pytest-shard==0.1.2

      # GKE mounts the node's nvidia-smi under /usr/local/nvidia/bin, which the runner image leaves off PATH.
      - run: echo /usr/local/nvidia/bin >> "${GITHUB_PATH}"

      - run: nvidia-smi

      # The core set for the areas sprag patches (scheduling, metrics and the OpenAI entrypoints), plus every test
      # file the change adds or edits. Marked cpu, but many resolve the CUDA platform and need a driver.
      - name: Unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OMP_NUM_THREADS: "1"
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "${BASE_SHA}" HEAD -- 'tests/**/test_*.py')
          # -n auto counts the node's 48 CPUs, and 48 workers overrun the runner pod's 32Gi; it requests 8 CPUs.
          uv run --no-sync python -m pytest -q -n 8 -m "core_model and cpu" \
            tests/core/sched tests/metrics tests/entrypoints/openai_api "${changed[@]}"

      # The single-L4 core set for the areas sprag patches, plus every test file the change adds or edits.
      - name: GPU tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          HF_HUB_DOWNLOAD_TIMEOUT: "300"
          HF_HUB_ETAG_TIMEOUT: "60"
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "${BASE_SHA}" HEAD -- 'tests/**/test_*.py')
          set +e
          uv run --no-sync python -m pytest -sv -m "core_model and cuda and L4 and cards_1" --run-level core_model \
            tests/core/sched tests/metrics tests/entrypoints/openai_api "${changed[@]}"
          status=$?
          # 5 = nothing selected, which is a pass for a change that touches no GPU test.
          [ "${status}" -eq 5 ] && exit 0
          exit "${status}"
